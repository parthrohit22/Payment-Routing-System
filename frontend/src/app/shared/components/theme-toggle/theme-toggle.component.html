<button
  type="button"
  class="theme-toggle"
  [attr.title]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
  [attr.aria-label]="
    isDark() ? 'Switch to light mode theme' : 'Switch to dark mode theme'
  "
  (click)="toggleTheme()"
>
  <span class="theme-toggle__icon" [class.theme-toggle__icon--dark]="isDark()" aria-hidden="true">
    <span class="theme-toggle__icon-core"></span>
  </span>
</button>
