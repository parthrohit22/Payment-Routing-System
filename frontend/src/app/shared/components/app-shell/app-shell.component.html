<div class="app-shell">
  <aside class="app-shell__sidebar">
    <div class="app-shell__brand">
      <span class="app-shell__logo">PRS</span>
      <strong>Payment Routing System</strong>
    </div>

    <nav class="app-shell__nav" aria-label="Primary">
      @for (item of navItems(); track item.route) {
        <a routerLinkActive="is-active" [routerLink]="item.route">
          <span class="app-shell__nav-code">{{ item.code }}</span>
          <strong>{{ item.label }}</strong>
        </a>
      }
    </nav>
  </aside>

  <div class="app-shell__main">
    <header class="app-shell__header">
      <div class="app-shell__header-copy">
        <h1>Payment Routing System</h1>
      </div>

      <div class="app-shell__header-actions">
        <span class="status-pill">{{ roleLabel() }}</span>
        <span
          class="status-pill"
          [ngClass]="{
            'status-pill--success': backendHealthy() === true,
            'status-pill--warning': backendHealthy() !== true,
          }"
        >
          {{ backendHealthy() === true ? 'API live' : 'API checking' }}
        </span>
        <app-theme-toggle></app-theme-toggle>
        <button
          type="button"
          class="button button--danger app-shell__delete-account"
          [disabled]="isDeletingAccount()"
          (click)="requestAccountDeletion()"
        >
          Delete Account
        </button>
        <button
          type="button"
          class="button button--ghost"
          [disabled]="isDeletingAccount()"
          (click)="logout()"
        >
          Log out
        </button>
      </div>
    </header>

    <main class="app-shell__content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<app-confirm-dialog
  [open]="isDeleteAccountDialogOpen()"
  title="Delete account"
  message="Your account and payments created by this account will be permanently removed."
  confirmLabel="Delete account"
  cancelLabel="Cancel"
  tone="danger"
  [disabled]="isDeletingAccount()"
  (cancelled)="cancelAccountDeletion()"
  (confirmed)="confirmAccountDeletion()"
></app-confirm-dialog>
